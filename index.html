<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Enter AI</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0b192c);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            overflow: hidden;
            position: relative;
        }

        /* Animated Gradient Background */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Glowing Circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.6;
            animation: float 8s ease-in-out infinite alternate;
        }

        .circle-1 {
            width: 320px;
            height: 320px;
            background: #6366f1;
            top: 10%;
            left: 15%;
        }

        .circle-2 {
            width: 350px;
            height: 350px;
            background: #ec4899;
            bottom: 10%;
            right: 15%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-box {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 30px;
            color: #38bdf8;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p span {
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        /* Single Action Button Style */
        .btn-container {
            display: flex;
            justify-content: center;
        }

        .btn-ai {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            background-size: 200% 200%;
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
            border: none;
        }

        .btn-ai:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(236, 72, 153, 0.6);
            background-position: 100% 0%;
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .card {
                padding: 35px 20px;
            }
            h1 {
                font-size: 1.6rem;
            }
            p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Glow Elements -->
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <!-- Main Card -->
    <div class="card">
        <div class="icon-box">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>
        <h1>Welcome!</h1>
        <p><span>We are here to help you.</span> Launch into your AI assistant workspace directly.</p>
        
        <!-- Single Button to Enter AI -->
        <div class="btn-container">
            <a href="Ai.html" class="btn-ai">
                <i class="fa-solid fa-robot"></i> Enter AI
            </a>
        </div>
    </div>

</body>
</html>
